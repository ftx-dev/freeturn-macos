name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Tests
        # На раннере есть Xcode: флаги для Command Line Tools не нужны.
        run: make test SWIFT_TEST_FLAGS=
